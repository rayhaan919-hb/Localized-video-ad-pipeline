name: CI Verification Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  worker-verify:
    name: Python Worker Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Pytest security, billing, AI & rendering suite
        run: pytest -v

  studio-and-remotion-verify:
    name: Remotion & Next.js Studio Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Verify @video-ad/remotion (typecheck + lint)
        run: |
          cd packages/remotion
          npm run typecheck
          npm run lint

      - name: Verify @video-ad/studio (typecheck + lint + test + build)
        run: |
          cd apps/studio
          npm run typecheck
          npm run lint
          npm run test
          npm run build
