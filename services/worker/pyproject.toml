[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localized-video-ad-worker"
version = "1.0.0"
description = "FastAPI + Celery + Vertex AI Veo 3.1 + FFmpeg worker for Localized AI Video Ad Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "celery>=5.3.6",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pip-audit>=2.7.0",
]
prod = [
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "google-auth>=2.29.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres_integration: requires live PostgreSQL via TEST_POSTGRES_URL",
    "redis_celery_integration: requires live Redis & Celery via TEST_REDIS_URL",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
